<style>
  .wrap { display: flex; flex-direction: column; gap: 12px; }
  .label { font-size: 12px; font-weight: 600; color: var(--sx-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .clock { font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    border: 1px solid var(--sx-border);
    background: transparent;
    color: var(--sx-fg);
    border-radius: 10px;
    padding: 8px 14px;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary { background: var(--sx-accent); border-color: var(--sx-accent); color: #ffffff; }
  .foot { font-size: 12.5px; color: var(--sx-muted); }
</style>
<div class="wrap">
  <div id="mode" class="label">Focus Sprint</div>
  <div id="clock" class="clock">25:00</div>
  <div class="row">
    <button id="toggle" class="primary" type="button">Start</button>
    <button id="work" type="button">25m</button>
    <button id="brk" type="button">5m Break</button>
  </div>
  <div id="stats" class="foot">Completed sprints: 0</div>
</div>
<script>
  var seconds = 25 * 60;
  var running = false;
  var handle = null;
  var completed = 0;

  var modeEl = document.getElementById('mode');
  var clockEl = document.getElementById('clock');
  var toggleBtn = document.getElementById('toggle');
  var statsEl = document.getElementById('stats');

  function render() {
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    clockEl.textContent = String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
    toggleBtn.textContent = running ? 'Pause' : 'Start';
    statsEl.textContent = 'Completed sprints: ' + completed;
  }

  if (window.Syntax && window.Syntax.storage) {
    window.Syntax.storage.get('completed').then(function (v) {
      if (typeof v === 'number') {
        completed = v;
        render();
      }
    });
  }

  toggleBtn.addEventListener('click', function () {
    running = !running;
    if (running) {
      handle = setInterval(function () {
        if (seconds > 0) {
          seconds -= 1;
          render();
        } else {
          clearInterval(handle);
          running = false;
          completed += 1;
          if (window.Syntax) {
            window.Syntax.storage.set('completed', completed);
            window.Syntax.toast('Focus sprint complete!');
          }
          render();
        }
      }, 1000);
    } else {
      clearInterval(handle);
    }
    render();
  });

  document.getElementById('work').addEventListener('click', function () {
    clearInterval(handle);
    running = false;
    seconds = 25 * 60;
    modeEl.textContent = 'Focus Sprint';
    render();
  });

  document.getElementById('brk').addEventListener('click', function () {
    clearInterval(handle);
    running = false;
    seconds = 5 * 60;
    modeEl.textContent = 'Short Break';
    render();
  });

  render();
</script>
