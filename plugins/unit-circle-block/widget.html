<style>
  .uc-wrap { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .uc-info { flex: 1; min-width: 190px; display: flex; flex-direction: column; gap: 10px; }
  .uc-readout { font-size: 14px; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; gap: 4px; }
  .uc-muted { font-size: 12.5px; color: var(--sx-muted); }
  input[type="range"] { width: 100%; accent-color: var(--sx-accent); }
  button {
    align-self: flex-start;
    padding: 8px 14px;
    border-radius: 10px;
    border: none;
    background: var(--sx-accent);
    color: #fff;
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
<div class="uc-wrap">
  <svg id="svg" width="180" height="180" viewBox="-120 -120 240 240">
    <line x1="-108" y1="0" x2="108" y2="0" stroke="var(--sx-border)" stroke-width="2" />
    <line x1="0" y1="-108" x2="0" y2="108" stroke="var(--sx-border)" stroke-width="2" />
    <circle cx="0" cy="0" r="88" fill="none" stroke="var(--sx-fg)" stroke-width="2" opacity="0.55" />
    <line id="xleg" x1="0" y1="0" x2="88" y2="0" stroke="#10b981" stroke-width="3" />
    <line id="yleg" x1="88" y1="0" x2="88" y2="0" stroke="#f59e0b" stroke-width="3" />
    <line id="ray" x1="0" y1="0" x2="88" y2="0" stroke="var(--sx-accent)" stroke-width="3" stroke-linecap="round" />
    <circle id="pt" cx="88" cy="0" r="6" fill="var(--sx-accent)" />
  </svg>
  <div class="uc-info">
    <div id="goal" class="uc-muted">Target: 60°</div>
    <input id="slider" type="range" min="0" max="360" step="15" value="30" />
    <div class="uc-readout">
      <div><strong>Angle:</strong> <span id="deg">30°</span></div>
      <div><strong>cos(θ):</strong> <span id="cos">0.866</span></div>
      <div><strong>sin(θ):</strong> <span id="sin">0.500</span></div>
    </div>
    <button id="check" type="button">Check angle</button>
  </div>
</div>
<script>
  var targetDeg = Number((window.Syntax && window.Syntax.props && window.Syntax.props.targetDeg) || 60);
  var slider = document.getElementById('slider');
  var goalEl = document.getElementById('goal');
  var degEl = document.getElementById('deg');
  var cosEl = document.getElementById('cos');
  var sinEl = document.getElementById('sin');
  var xleg = document.getElementById('xleg');
  var yleg = document.getElementById('yleg');
  var ray = document.getElementById('ray');
  var pt = document.getElementById('pt');

  goalEl.textContent = 'Rotate the radius to ' + targetDeg + '°';

  function update() {
    var d = Number(slider.value);
    var rad = (d * Math.PI) / 180;
    var c = Math.cos(rad);
    var s = Math.sin(rad);
    var px = c * 88;
    var py = -s * 88;
    degEl.textContent = d + '°';
    cosEl.textContent = c.toFixed(3);
    sinEl.textContent = s.toFixed(3);
    xleg.setAttribute('x2', px.toFixed(1));
    yleg.setAttribute('x1', px.toFixed(1));
    yleg.setAttribute('x2', px.toFixed(1));
    yleg.setAttribute('y2', py.toFixed(1));
    ray.setAttribute('x2', px.toFixed(1));
    ray.setAttribute('y2', py.toFixed(1));
    pt.setAttribute('cx', px.toFixed(1));
    pt.setAttribute('cy', py.toFixed(1));
  }

  slider.addEventListener('input', update);
  document.getElementById('check').addEventListener('click', function () {
    var d = Number(slider.value);
    var ok = d === targetDeg;
    if (window.Syntax) {
      window.Syntax.reportResult({
        correct: ok,
        score: ok ? 1 : 0,
        summary: ok ? 'Exact match (' + targetDeg + '°)' : 'Currently at ' + d + '° (target ' + targetDeg + '°)'
      });
      window.Syntax.toast(ok ? 'Spot on! ' + targetDeg + '° reached.' : 'Try adjusting closer to ' + targetDeg + '°.');
    }
  });
  update();
</script>
