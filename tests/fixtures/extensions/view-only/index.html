<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>View-Only Notebook</title></head>
<body>
  <div id="vo-status">booting</div>
  <button id="vo-create" type="button">Save Note</button>
  <script type="module">
    const CHANNEL = 'syntax-view-v1'
    let session = null
    let seq = 0
    const pending = new Map()

    function syscall(method, args = []) {
      return new Promise((resolve, reject) => {
        const callId = 'vo-' + (++seq)
        pending.set(callId, { resolve, reject })
        window.parent.postMessage({
          channel: CHANNEL,
          type: 'syntax:view-call',
          instanceId: session.instanceId,
          activationId: session.activationId,
          callId,
          target: 'syscall',
          method,
          args,
        }, '*')
      })
    }

    window.addEventListener('message', (event) => {
      const msg = event.data
      if (msg?.channel !== CHANNEL) return
      if (msg.type === 'syntax:view-init') {
        session = msg
        document.getElementById('vo-status').textContent = 'ready'
      } else if (msg.type === 'syntax:view-result') {
        const p = pending.get(msg.callId)
        if (!p) return
        pending.delete(msg.callId)
        if (msg.ok) p.resolve(msg.result)
        else p.reject(new Error(msg.error?.message || 'syscall failed'))
      }
    })

    document.getElementById('vo-create').addEventListener('click', async () => {
      const doc = await syscall('documents.create', [{
        type: 'note',
        title: 'View Only Note',
        data: { text: 'Saved directly without a worker' },
      }])
      document.getElementById('vo-status').textContent = 'created:' + doc.id
    })

    window.parent.postMessage({ channel: CHANNEL, type: 'syntax:view-ready' }, '*')
  </script>
</body>
</html>
