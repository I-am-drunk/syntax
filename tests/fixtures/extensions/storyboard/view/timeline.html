<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Storyboard Timeline</title>
</head>
<body>
  <div id="timeline-status">booting</div>
  <div id="timeline-sdk-boards">none</div>
  <script type="module">
    import { connectSyntaxView } from '../../sdk/syntax-view-v1.js'
    const view = await connectSyntaxView()
    document.getElementById('timeline-status').textContent = `timeline-ready:${view.viewId}`
    const boards = await view.callWorker('listBoards')
    document.getElementById('timeline-sdk-boards').textContent = Array.isArray(boards)
      ? boards.join('|')
      : 'invalid'
  </script>
</body>
</html>
