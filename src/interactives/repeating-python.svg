This diagram shows the same repeat-loop program written in two formats: pseudocode and Python.

Pseudocode program:
- repeat 3 times
  - drive forward
  - deliver package
  - turn right

Python program:
for i in range(3):
    truck.forward()
    truck.deliver()
    truck.right()

