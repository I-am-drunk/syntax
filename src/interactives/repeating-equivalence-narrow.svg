This diagram shows two programs joined by an equals sign to show they are equivalent (they do the same thing).

Program A (compact loop):
- repeat 3 times
  - drive forward
  - deliver package

Program B (expanded):
- drive forward
- deliver package
- drive forward
- deliver package
- drive forward
- deliver package

