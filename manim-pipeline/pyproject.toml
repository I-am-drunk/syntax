[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "manim-syntax"
version = "2.0.0"
description = "Brilliant-exact Manim Community graph/algebra library + Moving Sema director for Syntax MPM2D"
requires-python = ">=3.11"
dependencies = [
  "manim>=0.19.0",
  "edge-tts>=7.0.0",
  "MF-Tools>=0.2.0",
  "Pillow>=10.0.0",
]

[tool.setuptools.packages.find]
include = ["manim_syntax*"]
