name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, unit tests & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      - run: npm --prefix docs-site ci
      - run: npm --prefix docs-site run build
        env:
          SYNTAX_DOCS_BASE_PATH: /syntax-dev/docs
      - run: npm run build-storybook
      - run: npm run test:e2e
