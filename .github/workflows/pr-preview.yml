name: Infra PR preview

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

concurrency:
  group: syntax-infra-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      vars.SYNTAX_INFRA_ORIGIN != '' && github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Resolve preview base path
        id: base
        env:
          INFRA_URL: ${{ vars.SYNTAX_INFRA_ORIGIN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          preview_base=$(node -e '
            const raw = (process.env.INFRA_URL || "").replace(/\/+$/, "");
            const u = new URL(raw);
            if (u.protocol !== "https:") throw Error("Infra preview requires an HTTPS URL.");
            const prefix = u.pathname === "/" ? "" : u.pathname.replace(/\/+$/, "");
            process.stdout.write(`${prefix}/pr-${process.env.PR_NUMBER}/`);
          ')
          echo "preview_base=$preview_base" >> "$GITHUB_OUTPUT"
      - run: npm run build
        env:
          VITE_BASE: ${{ steps.base.outputs.preview_base }}
          VITE_CHANNEL: preview
          VITE_CLERK_PUBLISHABLE_KEY: ''
      - run: printf '%s\n' "$HEAD_SHA" > dist/preview-commit.txt
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - uses: actions/upload-artifact@v4
        with:
          name: infra-preview
          path: dist/
          retention-days: 2
          if-no-files-found: error

  publish:
    needs: build
    if: >-
      always() && vars.SYNTAX_INFRA_ORIGIN != '' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (needs.build.result == 'success' || github.event.action == 'closed')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pull-requests: write
    environment: syntax-infra
    env:
      INFRA_URL: ${{ vars.SYNTAX_INFRA_ORIGIN }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      CLOSED: ${{ github.event.action == 'closed' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@v4
        if: github.event.action != 'closed'
        with:
          name: infra-preview
          path: incoming
      - name: Check the static preview bundle
        if: github.event.action != 'closed'
        run: node .github/scripts/verify-static-artifact.mjs incoming preview-commit.txt "$HEAD_SHA"
      - name: Publish PR preview to GitHub Pages (syntax-infra)
        if: github.event.action != 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.SYNTAX_INFRA_DEPLOY_KEY }}
          DEPLOY_REPO: syntax-platform/syntax-infra
          DEPLOY_URL: ${{ vars.SYNTAX_INFRA_ORIGIN }}
          DEPLOY_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/deploy-preview-site.sh deploy incoming
      - name: Remove closed PR preview from GitHub Pages (syntax-infra)
        if: github.event.action == 'closed'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.SYNTAX_INFRA_DEPLOY_KEY }}
          DEPLOY_REPO: syntax-platform/syntax-infra
          DEPLOY_URL: ${{ vars.SYNTAX_INFRA_ORIGIN }}
        run: bash .github/scripts/deploy-preview-site.sh remove
      - name: Update the preview link on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- syntax-infra-preview -->';
            const number = Number(process.env.PR_NUMBER);
            const key = { ...context.repo, issue_number: number };
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            const closing = process.env.CLOSED === 'true';
            if (closing ? pr.state !== 'closed' : pr.state !== 'open' || pr.head.sha !== process.env.HEAD_SHA) return;
            const comments = await github.paginate(github.rest.issues.listComments, key);
            const previous = comments.find(comment => comment.user?.login === 'github-actions[bot]' && comment.body?.startsWith(marker));
            const base = process.env.INFRA_URL.replace(/\/+$/, '');
            const previewUrl = `${base}/pr-${number}/`;
            const commitUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/commit/${process.env.HEAD_SHA}`;
            const body = closing
              ? `${marker}\n### Syntax preview\n\nThe PR is closed. This preview has been removed.`
              : `${marker}\n### Syntax preview\n\n[Open the PR preview](${previewUrl}) · [Commit \`${process.env.HEAD_SHA.slice(0, 7)}\`](${commitUrl})`;
            if (previous) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: previous.id, body });
            } else if (!closing) {
              await github.rest.issues.createComment({ ...key, body });
            }
