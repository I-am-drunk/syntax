name: Deploy Dev Site (Alpha Pre-Release)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Pre-release tag to deploy (optional, defaults to current ref)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build dev site
        env:
          VITE_BASE: /${{ github.event.repository.name }}/dev/
          VITE_CHANNEL: dev
          VITE_RELEASE_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag || github.ref_name }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
        run: npm run build

      - name: Package dev channel archive
        run: tar -czf site-dev.tar.gz -C dist .

      - name: Attach dev archive to pre-release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" site-dev.tar.gz --clobber --repo "${{ github.repository }}"

      - name: Assemble combined Pages output (latest main + dev)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p _site _site/dev
          MAIN_TAG="$(gh release list --repo "${{ github.repository }}" --limit 30 --json tagName,isPrerelease --jq '[.[] | select(.isPrerelease == false)][0].tagName // empty')"
          USE_FRESH_MAIN=1
          if [ -n "$MAIN_TAG" ]; then
            if gh release download "$MAIN_TAG" --pattern "site-main.tar.gz" --repo "${{ github.repository }}"; then
              tar -xzf site-main.tar.gz -C _site
              if grep -q "/${{ github.event.repository.name }}/assets/" _site/index.html; then
                USE_FRESH_MAIN=0
              else
                rm -rf _site/*
                mkdir -p _site/dev
              fi
            fi
          fi
          if [ "$USE_FRESH_MAIN" = "1" ]; then
            VITE_BASE="/${{ github.event.repository.name }}/" VITE_CHANNEL="stable" VITE_RELEASE_TAG="main" VITE_CLERK_PUBLISHABLE_KEY="${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}" npm run build
            cp -r dist/. _site/
          fi
          tar -xzf site-dev.tar.gz -C _site/dev
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
