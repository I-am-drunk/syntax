# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "feat/.*"
      - "fix/.*"
  path_filters:
    - "src/**"
    - "scripts/**"
    - "tests/**"
    - ".github/**"
    - "!dist/**"
    - "!public/assets/**"
  path_instructions:
    - path: "src/extensions/**"
      instructions: |
        Enforce strict browser isolation and ownership boundaries:
        1. Sandboxed extension iframes must NEVER combine allow-scripts with allow-same-origin or allow-top-navigation.
        2. Every postMessage handler must check event.source === iframe.contentWindow, event.origin === 'null', and current (instanceId, activationId) so stale/forged messages are dropped.
        3. Blob URLs must not be revoked synchronously before the worker loads, and must always be revoked on settle/error/timeout.
        4. Host manifest records are authoritative; never trust extension-supplied IDs or safety flags.
        5. Termination/disable/reload must reject all pending promises and leave zero dangling workers, listeners, or UI contributions.
    - path: "src/core/**"
      instructions: |
        Verify Clerk auth and sync boundaries, zero eval/Function usage, and safe localStorage/cookie handling.
